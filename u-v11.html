<style>

body{

/* MAIN CARD: 2 CARDS PER ROW */

.add,

.dots{

/* MEDIA */

.media-mode{

.media-thumb{

height:100%;

}

width:100%;
height:100%;

}

.media-play{

}

/* SIDEBAR FIX */

<script>

const $=
id=>document.getElementById(id);

const KEY=
"SOROLIPI_DATA_V2";


let data={
cards:[]
};

let currentId=
null;


/* LOAD DATA */

try{

const saved=
localStorage.getItem(KEY);

if(saved){

const parsed=
JSON.parse(saved);

if(
parsed &&
Array.isArray(parsed.cards)
){

data=parsed;

}

}

}catch(e){

data={
cards:[]
};

}


/* ESC */

function esc(s){

return String(s??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m]));

}


/* ICON */

function isImageIcon(v){

return /^(https?:\/\/|data:image\/)/i
.test(String(v||"").trim());

}

function iconHTML(v){

let s=
String(v||"").trim();

if(!s)
return "📁";

if(isImageIcon(s)){

return `
<img
src="${esc(s)}"
alt=""
onerror="this.outerHTML='📁'">
`;

}

return esc(s);

}


/* BANGLA NUMBER */

function bn(v){

return String(v??"")
.replace(
/\d/g,
d=>"০১২৩৪৫৬৭৮৯"[d]
);

}


/* ACTION ICON */

function actionIconHTML(type){

const icons={
view:"👁️",
call:"📞"
};

return icons[type]||"";

}


/* LINK CARD */

function normalizeLinkCard(c){

const name=
String(c.name||"").trim();

if(
/লিংক$|link$/i.test(name)
){

c.linkMode=true;

}

}


/* MEDIA CARD */

function normalizeMediaCard(c){

const name=
String(c.name||"").trim();

if(
/ছবি|image|photo/i.test(name)
){

c.mediaType="image";

}else if(
/ভিডিও|video/i.test(name)
){

c.mediaType="video";

}else if(
/অডিও|audio/i.test(name)
){

c.mediaType="audio";

}

}


/* MEDIA TYPE */

function isMediaCard(c){

return !!(
c &&
(
c.mediaType ||
/ছবি|image|photo|ভিডিও|video|অডিও|audio/i
.test(String(c.name||""))
)
);

}

function mediaType(c){

if(c.mediaType)
return c.mediaType;

const n=
String(c.name||"");

if(/ভিডিও|video/i.test(n))
return "video";

if(/অডিও|audio/i.test(n))
return "audio";

return "image";

}


/* MEDIA URL */

function mediaUrl(v){

let s=
String(v||"").trim();

if(
!/^https?:\/\//i.test(s) &&
!/^data:/i.test(s)
){

return "";

}

return s;

}


/* RENDER CARDS */

function renderCards(){

const wrap=
$("cards");

wrap.innerHTML="";

let q=
String(
$("globalSearch")?.value||""
)
.toLowerCase()
.trim();

let cards=
data.cards.filter(c=>
!q ||
String(c.name||"")
.toLowerCase()
.includes(q)
);

$("cardCount")
.textContent=
String(cards.length)
.replace(
/\d/g,
d=>"০১২৩৪৫৬৭৮৯"[d]
);

if(!cards.length){

wrap.innerHTML=`
<div class="empty">
কোনো কার্ড পাওয়া যায়নি।
</div>
`;

return;

}

cards.forEach(c=>{

normalizeLinkCard(c);
normalizeMediaCard(c);

let div=
document.createElement("div");

div.className="card";

div.style.background=
c.color||"#fff";

div.innerHTML=`

<div style="
display:flex;
align-items:center;
">

<div class="card-icon">
${iconHTML(c.icon)}
</div>

<h3>
${esc(c.name)}
</h3>

</div>

<button
class="dots"
type="button">
⋮
</button>

<div class="menu-pop">

<button
data-action="open">
দেখুন
</button>

</div>

`;

div.onclick=e=>{

if(
e.target.closest(".dots") ||
e.target.closest(".menu-pop")
){

return;

}

openCard(c.id);

};

const dots=
div.querySelector(".dots");

const menu=
div.querySelector(".menu-pop");

dots.onclick=e=>{

e.stopPropagation();

menu.style.display=
menu.style.display==="block"
?"none"
:"block";

};

menu.querySelector(
'[data-action="open"]'
).onclick=e=>{

e.stopPropagation();

openCard(c.id);

};

wrap.appendChild(div);

});

}


/* CARD PASSWORD */

let unlockedCardIds=
new Set();

let pendingCardId=
null;

function showCardPassword(id){

pendingCardId=
id;

const c=
data.cards.find(
x=>x.id===id
);

$("cardPasswordTitle")
.textContent=
(c&&c.name?c.name:"কার্ড")
+
" — পাসওয়ার্ড";

$("cardPasswordInput")
.value="";

$("cardPasswordError")
.style.display=
"none";

$("cardPasswordModal")
.classList.add("show");

setTimeout(
()=>$("cardPasswordInput").focus(),
50
);

}

function closeCardPassword(){

$("cardPasswordModal")
.classList.remove("show");

pendingCardId=
null;

}

function enterCardPassword(){

let c=
data.cards.find(
x=>x.id===pendingCardId
);

if(!c){

closeCardPassword();
return;

}

let p=
String(c.password||"").trim();

if(!p){

closeCardPassword();
openCard(c.id);
return;

}

if(
$("cardPasswordInput").value===p
){

unlockedCardIds.add(c.id);

closeCardPassword();

openCard(c.id);

}else{

$("cardPasswordError")
.style.display=
"block";

$("cardPasswordInput")
.focus();

}

}

$("cardPasswordEnter")
.onclick=
enterCardPassword;

$("cardPasswordCancel")
.onclick=
closeCardPassword;

$("cardPasswordInput")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
enterCardPassword();

/* TOTAL */

function isMoneyHeader(h){

return /টাকা|মূল্য|দাম|খরচ|amount|price|taka|money/i
.test(String(h||""));

}

function isGBHeader(h){

return /জিবি|gb|g\.b\.|gigabyte/i
.test(String(h||""));

}

function isTotalHeader(h){

return isMoneyHeader(h) ||
isGBHeader(h);

}

function toEnglishDigits(v){

return String(v??"")
.replace(
/[০-৯]/g,
d=>"০১২৩৪৫৬৭৮৯".indexOf(d)
);

}

function totalNumber(v){

let s=
toEnglishDigits(v)
.replace(
/[, \s৳$]/g,
""
)
.replace(
/(?:gb|g\.b\.|জিবি|টাকা|৳|মূল্য|দাম)/gi,
""
)
.trim();

if(!s)
return 0;

let n=
Number(s);

return Number.isFinite(n)
?n
:0;

}

function totalText(v){

return Number.isInteger(v)
?
String(v).replace(
/\d/g,
d=>"০১২৩৪৫৬৭৮৯"[d]
)
:
String(
Number(v)
.toFixed(2)
.replace(/\.00$/,"")
)
.replace(
/\d/g,
d=>"০১২৩৪৫৬৭৮৯"[d]
);

}


/* PLUS / MINUS */

function addRemoveHTML(value){

let s=
String(value??"");

let t=
s.trim();

if(
/^\+\s*[0-9০-৯]/
.test(t)
){

return `
<span class="plus-value">
${esc(s)}
</span>
`;

}

if(
/^-\s*[0-9০-৯]/
.test(t)
){

return `
<span class="minus-value">
${esc(s)}
</span>
`;

}

return esc(s);

}


/* NAME-WISE RUNNING TOTAL */

function isRunningTotalHeader(h){

return /মোট|total|balance/i
.test(String(h||""));

}

function isNameHeader(h){

return /নাম|name/i
.test(String(h||""));

}

function isAddRemoveHeader(h){

return /যুক্ত|অপসারণ|যোগ|বিয়োগ|বিয়োগ|add|remove|adjust/i
.test(String(h||""));

}

function signedDelta(value){

const s=
toEnglishDigits(value)
.replace(/,/g,"")
.trim();

const m=
s.match(
/[+-]\s*\d+(?:\.\d+)?/
);

if(!m)
return 0;

const n=
Number(
m[0].replace(/\s/g,"")
);

return Number.isFinite(n)
?n
:0;

}

function buildNameWiseTotals(card){

const result=
new Map();

if(
!card ||
!Array.isArray(card.headers) ||
!Array.isArray(card.rows)
)
return result;

const nameHeader=
card.headers.find(
isNameHeader
);

const totalHeader=
card.headers.find(
isRunningTotalHeader
);

const changeHeader=
card.headers.find(
isAddRemoveHeader
);

if(
!nameHeader ||
!totalHeader ||
!changeHeader
)
return result;

card.rows.forEach(row=>{

const name=
String(
row?.[nameHeader]??""
)
.trim();

if(!name)
return;

const key=
name.toLocaleLowerCase();

if(!result.has(key)){

result.set(
key,
{
name,
base:0,
hasBase:false,
delta:0,
total:0
}
);

}

const item=
result.get(key);

const baseText=
String(
row?.[totalHeader]??""
)
.trim();

if(
!item.hasBase &&
baseText!==""
){

item.base=
totalNumber(baseText);

item.hasBase=
true;

}

item.delta+=
signedDelta(
row?.[changeHeader]??""
);

});

result.forEach(item=>{

item.total=
item.base+
item.delta;

});

return result;

}


/* MONTH / YEAR */

function monthGroupKey(value){

let s=
String(value??"").trim();

if(!s)
return "no-date";

s=
s.replace(
/[০-৯]/g,
d=>"০১২৩৪৫৬৭৮৯".indexOf(d)
);

let y=0,
m=0;

let a=
s.match(
/^(\d{4})[-/.](\d{1,2})(?:[-/.](\d{1,2}))?/
);

if(a){

y=
Number(a[1]);

m=
Number(a[2]);

}else{

a=
s.match(
/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/
);

if(a){

y=
Number(a[3]);

m=
Number(a[2]);

}

}

if(
!y ||
m<1 ||
m>12
){

const d=
new Date(s);

if(
!Number.isNaN(d.getTime())
){

y=
d.getFullYear();

m=
d.getMonth()+1;

}

}

return y &&
m>=1 &&
m<=12
?
`${y}-${String(m).padStart(2,"0")}`
:
"no-date";

}

function monthGroupTitle(key){

if(key==="no-date")
return "তারিখ নেই";

const months=[
"জানুয়ারি",
"ফেব্রুয়ারি",
"মার্চ",
"এপ্রিল",
"মে",
"জুন",
"জুলাই",
"আগস্ট",
"সেপ্টেম্বর",
"অক্টোবর",
"নভেম্বর",
"ডিসেম্বর"
];

const p=
String(key).split("-");

const y=
Number(p[0]);

const m=
Number(p[1]);

return y &&
m>=1 &&
m<=12
?
`${months[m-1]} - ${bn(y)}`
:
key;

}

function monthGroupOrder(keys){

return keys.sort(
(a,b)=>{

if(a==="no-date")
return 1;

if(b==="no-date")
return -1;

return b.localeCompare(a);

}
);

}

/* START */

function ensureGmailCard(){

if(!Array.isArray(data.cards))
data.cards=[];

/*
এই ফাংশনটি শুধু Gmail card-এর প্রয়োজনীয়
normalization/compatibility বজায় রাখে।
বিদ্যমান card/data মুছে ফেলা হয় না।
*/

data.cards.forEach(c=>{

if(
String(c.name||"")
.trim()==="জিমেইল"
){

c.gmailCard=true;

}

});

}

ensureGmailCard();

(data.cards||[])
.forEach(c=>{

normalizeLinkCard(c);

normalizeMediaCard(c);

});

try{

if(
data &&
Array.isArray(data.cards)
){

localStorage.setItem(
KEY,
JSON.stringify(data)
);

}

}catch(e){}


renderCards();


/* SAME ORIGIN SYNC */

if(
"BroadcastChannel" in window
){

try{

const bc=
new BroadcastChannel(
"SOROLIPI_DATA_SYNC"
);

bc.onmessage=()=>{

try{

const latest=
localStorage.getItem(KEY);

if(!latest)
return;

let parsed=
JSON.parse(latest);

if(
!parsed ||
!Array.isArray(parsed.cards)
)
return;

data=
parsed;

ensureGmailCard();

(data.cards||[])
.forEach(c=>{

normalizeLinkCard(c);

normalizeMediaCard(c);

});

renderCards();

if(currentId){

const c=
data.cards.find(
x=>x.id===currentId
);

if(c){

if(isMediaCard(c)){

renderMediaCardView(
c,
$("tableSearch")
.value
.toLowerCase()
);

}else if(c.linkMode){

renderLinkCardView(
c,
$("tableSearch")
.value
.toLowerCase()
);

}else{

renderTable();

}

}

}

}catch(e){}

};

}catch(e){}

}

</script>
