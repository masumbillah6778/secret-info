<html lang="bn">
<head>
<meta charset="utf-8">

<title>SOROLIPI - User / View Panel</title>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:
Arial,
"Noto Sans Bengali",
sans-serif;

color:#17324d
}

button,
input{

}

.hidden{

}

.sidebar{

left:0;
top:0;
bottom:0;

background:#07579f;
color:#fff;
padding:18px 14px;
z-index:30;

}

.logo{
font-size:26px;
font-weight:800;
padding:8px 10px 24px
}

.nav button{
display:block;
width:100%;
border:0;
background:transparent;
color:#fff;
text-align:left;
padding:13px;
border-radius:9px;
margin:5px 0;

}

.nav button:hover,
.nav button.active{
background:#2389e4
}

.main{
margin-left:250px;
min-height:100vh
}

.top{
height:66px;
background:#fff;
border-bottom:1px solid #dce7f1;
display:flex;
align-items:center;
padding:0 20px;
gap:15px;
position:sticky;
top:0;
z-index:20
}

.menu{
border:0;
background:transparent;
color:#07579f;
font-size:25px;
cursor:pointer
}

.brand{
font-weight:800;
color:#07579f;
font-size:22px
}

.search{
margin-left:auto
}

.search input{
width:260px;
padding:9px 12px;
border:1px solid #ccdbea;
border-radius:8px
}

.content{
padding:25px
}

.welcome h1{
margin:0 0 5px;
color:#174c7c
}

.welcome p{
margin:0;
color:#627789
}

.section{
display:flex;
justify-content:space-between;
align-items:center;
margin:25px 0 15px
}

.section h2{
margin:0;
font-size:28px
}

.count b{
color:#e33d3d
}

.cards{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(205px,1fr));
gap:17px
}

.add,
.card{
min-height:140px;
border-radius:14px;
display:flex;
align-items:center;

}

.card h3{

}

.card .card-icon{
width:52px;
height:52px;
display:flex;
align-items:center;
justify-content:center;

margin-right:12px
}

.card .card-icon img{
width:100%;
height:100%;
object-fit:contain
}

.dots{
position:absolute;
right:8px;
top:5px;
border:0;
background:transparent;
font-size:25px;

}

.menu-pop{
display:none;
position:absolute;
right:8px;
top:38px;
background:#fff;
border:1px solid #dbe6ef;

}

.page{

}

.page.active{
display:block
}

.table-head{
background:#fff;
border:1px solid #dbe6ef;
border-radius:12px;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.back{
border:0;
background:#eef5fa;
color:#07579f;
padding:9px 13px;
border-radius:8px;

}

.table-search{
margin-left:auto
}

.table-search input{
padding:9px 12px;
border:1px solid #ccdbea;
border-radius:8px
}

.table-wrap{
margin-top:15px;
background:#fff;
border:1px solid #dbe6ef;
border-radius:12px;
overflow:auto
}

table{
width:100%;
border-collapse:collapse;
min-width:700px
}

th,
td{
padding:10px;
border-bottom:1px solid #e5edf3;
border-right:1px solid #e5edf3;

}

th{
background:#edf5fa;

}

.action{

text-align:center
}

.act{

height:34px;
display:inline-flex;
align-items:center;
justify-content:center;
padding:5px;
font-size:20px;

vertical-align:middle;
border:1px solid #d8e4ed;
background:#fff;

}

.action-icon-img{
width:24px;
height:24px;
object-fit:contain;
display:block
}

.money-total{
font-weight:900;
color:#d62424;
font-size:16px
}

.empty{
padding:30px;
text-align:center;
color:#718596
}

.link-grid{
display:grid;
grid-template-columns:
repeat(4,minmax(0,1fr));
gap:10px
}

.link-tile{
min-height:95px;
background:#fff;
border:1px solid #d9e5ee;
border-radius:11px;

height:36px;

align-items:center;

.link-tile-name{

font-weight:800;

.link-tile-url{
font-size:10px;
color:#74899a;
word-break:break-all;

}


/* =========================
   MEDIA
========================= */

.media-mode{
margin-top:0
}

.media-month{
margin:0 0 22px;
background:#fff;
border:1px solid #dbe6ef;
border-radius:13px;
padding:14px
}

.media-date{
font-size:19px;
font-weight:900;
color:#07579f;
margin-bottom:12px
}

.media-grid{
display:grid;
grid-template-columns:
repeat(4,minmax(0,1fr));

}

.media-tile{
background:#fff;
border:1px solid #d9e5ee;
border-radius:12px;
overflow:hidden;
box-shadow:0 3px 12px #194c7112;

cursor:pointer
}

.media-tile-head{
padding:9px 10px;
font-weight:800;
color:#17324d;
white-space:nowrap;
overflow:hidden;

}

.media-thumb-wrap{
aspect-ratio:16/10;
background:#edf3f8;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

.media-thumb{
width:100%;
height:100%;
object-fit:cover;
display:block
}

.media-tile video{
width:100%;
height:100%;
object-fit:cover;
display:block
}

.media-audio{
width:calc(100% - 16px);
margin:8px
}

.media-play{
font-size:38px;
line-height:1
}

.media-empty{
padding:25px;
text-align:center;
color:#667b8c;
background:#fff;
border:1px dashed #cbdbe7;
border-radius:12px
}

.media-lightbox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
z-index:9999;
align-items:center;
justify-content:center;
padding:20px
}

.media-lightbox.show{
display:flex
}

.media-lightbox-inner{
position:relative;
max-width:min(94vw,1000px);
max-height:92vh;
width:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

.media-lightbox img,
.media-lightbox video{
max-width:94vw;
max-height:78vh;
border-radius:10px;
background:#000;
object-fit:contain
}

.media-lightbox audio{
width:min(760px,90vw)
}

.media-lightbox-name{
color:#fff;
font-size:18px;
font-weight:800;
margin-top:10px;
text-align:center
}

.media-close{
position:absolute;
right:-4px;
top:-42px;
width:38px;
height:38px;
border:0;
border-radius:50%;
background:#fff;
color:#222;
font-size:28px;
line-height:1;
cursor:pointer
}


/* =========================
   CARD PASSWORD MODAL
========================= */

#cardPasswordModal{
z-index:10000;
}

.password-box{
width:min(420px,94vw);
background:#fff;
border-radius:15px;
padding:22px;
box-shadow:0 15px 50px #0006;
}

.password-box h3{
margin:0 0 8px;
color:#07579f;
}

.password-box p{
margin:0 0 15px;
color:#63798a;
font-size:14px;
}

.password-box input{
width:100%;
padding:11px 13px;
border:1px solid #ccdbe7;
border-radius:8px;
outline:0;
}

.password-error{
display:none;
color:#d52b2b;
font-size:13px;
margin-top:8px;
font-weight:700;
}

.password-actions{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:16px;
}

@media(max-width:900px){

.media-grid{
grid-template-columns:
repeat(3,minmax(0,1fr))
}

}

@media(max-width:800px){

.sidebar{
transform:translateX(-100%)
}

.sidebar.open{
transform:translateX(0)
}

}

.menu{

}

.link-grid{
grid-template-columns:
repeat(4,minmax(0,1fr));
gap:8px
}

.link-tile{
min-height:92px;
padding:8px 4px
}

.video-icon{
width:32px;
height:32px;
font-size:17px
}

.link-tile-name{
font-size:12px
}

.link-tile-url{
font-size:9px
}

}

@media(max-width:600px){

.media-grid{
grid-template-columns:
repeat(2,minmax(0,1fr));
gap:8px
}

.media-month{
padding:10px
}

.media-date{
font-size:17px
}

.media-tile-head{
font-size:12px;
padding:7px
}

.media-close{
right:0
}

}

@media(max-width:480px){

.search{
display:none
}

.cards{
gap:10px
}

.card{
min-height:120px
}

.card h3{
font-size:18px
}

.gmail-name{
font-size:23px
}

.link-grid{
grid-template-columns:

gap:6px
}

.link-tile{
min-height:82px;
border-radius:9px
}

.video-icon{
width:28px;
height:28px;
font-size:15px;
margin-bottom:5px
}

.link-tile-name{
font-size:10px
}

.link-tile-url{

}

}

</style>

<script>

const $=
id=>document.getElementById(id);

const KEY=
"SOROLIPI_DATA_V2";


let data={
cards:[]
};

let currentId=
null;


/* =========================
   PASSWORD UNLOCK STATE
========================= */

const unlockedCardIds=
new Set();

let pendingPasswordCardId=
null;


/* =========================
   LOAD DATA
========================= */

try{

const saved=
localStorage.getItem(KEY);

if(saved){

const parsed=
JSON.parse(saved);

if(
parsed &&
Array.isArray(parsed.cards)
){

data=parsed;

}

}

}catch(e){

data={
cards:[]
};

}


/* =========================
   ESC
========================= */

function esc(s){

return String(s??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m]));

}


/* =========================
   ICON
========================= */

function isImageIcon(v){

return /^(https?:\/\/|data:image\/)/i
.test(String(v||"").trim());

}


function iconHTML(v){

let s=
String(v||"").trim();

if(!s)
return "📁";

if(isImageIcon(s)){

return `
<img
src="${esc(s)}"
alt=""
onerror="
this.style.display='none';
this.parentElement.textContent='📁';
">
`;

}

return esc(s);

}


/* =========================
   ACTION ICON
========================= */

const ACTION_ICONS={

view:"👁️",

call:"📞"

};


function isImageActionIcon(v){

return /^(https?:\/\/|data:image\/)/i
.test(String(v||"").trim());

}


function actionIconHTML(type){

let v=
ACTION_ICONS[type]||"•";

let s=
String(v).trim();

if(isImageActionIcon(s)){

return `
<img
src="${esc(s)}"
alt=""
class="action-icon-img"
onerror="
this.style.display='none';
this.parentElement.textContent='•';
">
`;

}

return esc(s);

}


/* =========================
   GMAIL
========================= */

function isGmailCard(c){

return !!c &&
String(c.name||"").trim()==="জিমেইল";

}


function ensureGmailCard(){

let gs=
data.cards.filter(
isGmailCard
);

let g=gs[0];

if(!g){

g={

id:"gmail-"+Date.now(),

name:"জিমেইল",

headers:[],

color:"c4",

rows:[],

linkMode:false,

gmailRecords:[]

};

data.cards.push(g);

}

if(!Array.isArray(g.gmailRecords)){

g.gmailRecords=[];

}

if(gs.length>1){

gs.slice(1).forEach(x=>{

if(Array.isArray(x.gmailRecords)){

g.gmailRecords.push(
...x.gmailRecords
);

}

});

data.cards=
data.cards.filter(
x=>x===g ||
!isGmailCard(x)
);

}

return g;

}


/* =========================
   LINK CARD
========================= */

function isLinkCard(c){

return !!c &&
/(?:লিংক|লিঙ্ক)\s*$/i
.test(
String(c.name||"")
);

}


function normalizeLinkCard(c){

c.linkMode=
isLinkCard(c);

if(
c.linkMode &&
(!Array.isArray(c.headers) ||
!c.headers.length)
){

c.headers=[
"তারিখ",
"নাম",
"লিংক"
];

}

}


/* =========================
   MEDIA CARD
========================= */

function mediaType(c){

const n=
String(c?.name||"").trim();

if(/অডিও|audio|mp3|sound/i.test(n))
return "audio";

if(/ভিডিও|video|movie|clip/i.test(n))
return "video";

if(/ছবি|ফটো|photo|image/i.test(n))
return "image";

return "";

}


function isMediaCard(c){

return !!mediaType(c);

}


function normalizeMediaCard(c){

const t=
mediaType(c);

if(
t &&
(!Array.isArray(c.headers) ||
!c.headers.length)
){

c.headers=[
"নং",
"তারিখ",
"নাম",
"লিংক"
];

}

}


/* =========================
   PASSWORD
========================= */

function openCardPassword(id){

const c=
data.cards.find(
x=>x.id===id
);

if(!c)
return;

pendingPasswordCardId=
id;

$("cardPasswordTitle").textContent=
c.name+
" - পাসওয়ার্ড";

$("cardPasswordInput").value="";

$("cardPasswordError")
.style.display="none";

$("cardPasswordModal")
.classList.add("show");

setTimeout(()=>{

$("cardPasswordInput").focus();

},80);

}


function closeCardPassword(){

pendingPasswordCardId=
null;

$("cardPasswordInput").value="";

$("cardPasswordError")
.style.display="none";

$("cardPasswordModal")
.classList.remove("show");

}


function submitCardPassword(){

if(!pendingPasswordCardId)
return;

const c=
data.cards.find(
x=>x.id===pendingPasswordCardId
);

if(!c){

closeCardPassword();

return;

}

const entered=
String(
$("cardPasswordInput").value||""
);

const savedPassword=
String(
c.password||""
);

if(
entered===savedPassword
){

unlockedCardIds.add(
String(c.id)
);

const id=
pendingPasswordCardId;

closeCardPassword();

openCardUnlocked(id);

}else{

$("cardPasswordError")
.style.display="block";

$("cardPasswordInput").value="";

$("cardPasswordInput").focus();

}

}


$("cardPasswordCancel")
.onclick=closeCardPassword;

$("cardPasswordSubmit")
.onclick=submitCardPassword;

$("cardPasswordInput")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

submitCardPassword();

}

if(e.key==="Escape"){

closeCardPassword();

}

});


$("cardPasswordModal")
.addEventListener(
"click",
e=>{

if(
e.target===
$("cardPasswordModal")
){

closeCardPassword();

}

});


/* =========================
   OPEN CARD
========================= */

function openCard(id){

const c=
data.cards.find(
x=>x.id===id
);

if(!c)
return;

const password=
String(c.password||"").trim();

if(
password &&
!unlockedCardIds.has(
String(id)
)
){

openCardPassword(id);

return;

}

openCardUnlocked(id);

}


function openCardUnlocked(id){

currentId=
id;

const c=
data.cards.find(
x=>x.id===id
);

if(!c)
return;

$("dashboard")
.classList.remove("active");

$("settings")
.classList.remove("active");

$("tablePage")
.classList.add("active");

$("tableTitle").textContent=
c.name;

renderTable();

}


/* =========================
   RENDER CARDS
========================= */

function renderCards(){

const wrap=
$("cards");

wrap.innerHTML="";

const q=
String(
$("globalSearch")?.value||""
)
.toLowerCase()
.trim();

let cards=
data.cards.filter(c=>
!q ||
String(c.name||"")
.toLowerCase()
.includes(q)
);

$("cardCount").textContent=
bn(cards.length);

if(!cards.length){

wrap.innerHTML=`
<div class="empty">
কোনো কার্ড পাওয়া যায়নি।
</div>
`;

return;

}

cards.forEach(c=>{

normalizeLinkCard(c);
normalizeMediaCard(c);

let div=
document.createElement("div");

div.className="card";

div.style.background=
c.color||"#fff";

div.innerHTML=`

<div class="card-icon">
${iconHTML(c.icon)}
</div>

<h3>
${esc(c.name)}
</h3>

<button
class="dots"
type="button">
⋮
</button>

<div class="menu-pop">

<button
data-action="open">
👁️ দেখুন
</button>

</div>

`;

);

/* =========================
   DATE
========================= */

const MONTHS=[
"জানুয়ারি",
"ফেব্রুয়ারি",
"মার্চ",
"এপ্রিল",
"মে",
"জুন",
"জুলাই",
"আগস্ট",
"সেপ্টেম্বর",
"অক্টোবর",
"নভেম্বর",
"ডিসেম্বর"
];


function dateInfo(v){

let s=
String(v||"").trim();

if(!s)
return null;

let d=
null;

if(
/^\d{4}-\d{2}-\d{2}$/.test(s)
){

let p=s.split("-");

d=new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}else{

let m=
s.match(
/^(\d{1,2})-(\d{1,2})-(\d{4})$/
);

if(m){

d=new Date(
Number(m[3]),
Number(m[2])-1,
Number(m[1])
);

}

}

if(
!d ||
isNaN(d.getTime())
)
return null;

return {

year:
d.getFullYear(),

month:
d.getMonth(),

day:
d.getDate(),

date:
String(d.getDate())
.padStart(2,"0")
+"-"+
String(d.getMonth()+1)
.padStart(2,"0")
+"-"+
d.getFullYear()

};

}


/* =========================
   LINK HEADER
========================= */

function isLinkHeader(h){

return /^(লিংক|link)(?:\s*(নাম|name))?$/i
.test(String(h).trim())
||
/লিংক/i.test(String(h));

}


/* =========================
   MONEY
========================= */

function isMoneyHeader(h){

return /টাকা|মূল্য|দাম|খরচ|amount|price|taka|money/i
.test(String(h||""));

}


/* =========================
   GB
========================= */

function isGBHeader(h){

return /জিবি|gb|g\.b\.|gigabyte/i
.test(String(h||""));

}

/* =========================
   MEDIA
========================= */

function renderMediaCard(c){

const type=
mediaType(c);

const rows=
Array.isArray(c.rows)
?c.rows
:[];

if(!rows.length){

$("tableSections").innerHTML=`
<div class="media-empty">
কোনো মিডিয়া তথ্য নেই।
</div>
`;

return;

}

let groups={};

rows.forEach((r,i)=>{

let date="";

for(const h of c.headers){

if(
/তারিখ|date/i.test(h)
){

date=
r[h]||"";

break;

}

}

let di=
dateInfo(date);

let key=
di
?`${di.year}-${di.month}`
:"unknown";

if(!groups[key]){

groups[key]={
label:
di
?`${MONTHS[di.month]} - ${di.year}`
:"অন্যান্য",
rows:[]
};

}

groups[key].rows.push({
r,
i,
date:di
});

});

const mode=
document.createElement("div");

mode.className=
"media-mode";

Object.keys(groups)
.sort((a,b)=>{

if(a==="unknown")
return 1;

if(b==="unknown")
return -1;

let [ay,am]=
a.split("-").map(Number);

let [by,bm]=
b.split("-").map(Number);

return (
by*12+bm
)-
(
ay*12+am
);

})
.forEach(key=>{

const group=
groups[key];

let monthBox=
document.createElement("div");

monthBox.className=
"media-month";

monthBox.innerHTML=`

<div class="media-date">
${esc(group.label)}
</div>

<div class="media-grid">
</div>

`;

const grid=
monthBox.querySelector(
".media-grid"
);

group.rows.forEach(item=>{

const r=item.r;
const i=item.i;

let name=
r["নাম"]||
r["Name"]||
r["name"]||
"মিডিয়া";

let url="";

for(const h of c.headers){

if(isLinkHeader(h)){

url=
String(r[h]||"");

break;

}

}

if(!url){

for(const k of Object.keys(r)){

if(
/^https?:\/\//i.test(
String(r[k]||"")
)
){

url=
String(r[k]);

break;

}

}

}

let tile=
document.createElement("div");

tile.className=
"media-tile";

tile.innerHTML=`

<div class="media-tile-head">
${esc(name)}
</div>

<div class="media-thumb-wrap">
</div>

`;

const thumb=
tile.querySelector(
".media-thumb-wrap"
);

if(type==="image"){

if(url){

thumb.innerHTML=`
<img
class="media-thumb"
src="${esc(url)}"
alt="${esc(name)}"
onerror="
this.style.display='none';
this.parentElement.innerHTML='🖼️';
">
`;

}else{

thumb.innerHTML=
`<div class="media-play">🖼️</div>`;

}

}else if(type==="video"){

if(url){

thumb.innerHTML=`
<video
src="${esc(url)}"
controls
preload="metadata">
</video>
`;

}else{

thumb.innerHTML=
`<div class="media-play">▶️</div>`;

}

}else if(type==="audio"){

if(url){

thumb.innerHTML=`
<div style="
width:100%;
display:flex;
align-items:center;
justify-content:center;
padding:12px;
">

<div
class="media-play"
style="margin-bottom:8px">
🎵
</div>

</div>
`;

const audio=
document.createElement("audio");

audio.className=
"media-audio";

audio.controls=true;

audio.src=url;

tile.appendChild(audio);

}else{

thumb.innerHTML=
`<div class="media-play">🎵</div>`;

}

}

tile.onclick=e=>{

if(
e.target.closest("audio") ||
e.target.closest("video")
){

return;

}

if(url){

openMediaLightbox(
type,
url,
name
);

}

};

grid.appendChild(tile);

});

mode.appendChild(monthBox);

});

$("tableSections")
.appendChild(mode);

}

){

r[h]||"";

.textContent=name||"";
