<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="গুরুত্বপূর্ণ লিংক সমূহ">
  <title>গুরুত্বপূর্ণ লিংক সমূহ</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://masumbillah6778.github.io/fonts/bangla/bangla-custom-font.css">
  <link rel="stylesheet" href="https://masumbillah6778.github.io/css/custom-scrollbar.css">
  <link rel="icon" type="image/x-icon" href="https://rab-8.github.io/images/SRB-8.png">
  <style>
    :root { --page-bg:#f3f9fc; --text:#123b61; --green:#087a35; }
    * { box-sizing:border-box; }
    body {
      background-image:url('https://rab-8.github.io/images/SRB-1.jpg');
      background-repeat:no-repeat; background-size:cover; background-position:center;
      background-attachment:fixed; margin:0; min-height:100vh; padding:26px;
      color:var(--text);
    }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .board {
      max-width:1600px; margin:0 auto; padding:0 0 28px;
      border-radius:28px; background:rgba(255,255,255,.58);
      box-shadow:0 12px 35px rgba(24,72,100,.09); overflow:visible;
    }
    .hero {
      min-height:174px; margin:0 0 24px; padding:24px 80px;
      border-radius:26px;
      background:linear-gradient(110deg,#0876c9 0%,#00a9a9 54%,#3fc95e 100%);
      color:yellow; text-align:center; position:sticky;
top:0;
z-index:15;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      box-shadow:0 7px 18px rgba(0,112,153,.16);
    }
    .hero h1 { margin:0; font-size:clamp(29px,4vw,58px); font-family:'khalid-bin-olid'; font-weight:normal; line-height:1.35; }
    .hero p { margin:8px 0 0; font-size:clamp(15px,1.7vw,25px); font-family:solaiman-lipi; }
    .hero .chain { font-size:.86em; margin-right:14px; }
    .menu-toggle {
      position:absolute; left:24px; top:50%; transform:translateY(-50%);
      width:54px; height:50px; border:0; border-radius:12px;
      background:rgba(255,255,255,.18); color:#fff; font-size:34px;
      display:grid; place-items:center;
    }
    .menu-toggle:hover { background:rgba(255,255,255,.3); }
    .spark { position:absolute; right:5%; top:28%; font-size:56px; opacity:.8; transform:rotate(12deg); }
    .cards {
      padding:0 28px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px 30px;
    }
    .card {
      --accent:#087bd3; --pale:#e3f3ff; --edge:#a9dcff; --ink:#0755a7;
      min-height:226px; padding:22px 20px; border:2px solid var(--edge);
      border-radius:25px; position:relative; overflow:hidden;
      background:linear-gradient(115deg,var(--pale),rgba(255,255,255,.84));
      backdrop-filter:blur(3px); box-shadow:0 5px 10px rgba(32,76,110,.09);
      transition:transform .2s ease,box-shadow .2s ease;
      display:flex; flex-direction:column; justify-content:space-between;
      text-decoration:none; color:inherit;
    }
    .card::before {
      content:""; position:absolute; width:58%; height:55%; left:-5%; bottom:-28%;
      border-radius:50% 50% 0 0; background:var(--edge); opacity:.52; pointer-events:none;
    }
    .card:hover { transform:translateY(-4px); box-shadow:0 12px 22px rgba(32,76,110,.14); }
    .card-top { display:flex; gap:18px; align-items:center; position:relative; z-index:1; }
    .icon-wrap {
      flex:0 0 106px; width:106px; height:106px; border-radius:50%;
      display:grid; place-items:center; color:white; background:linear-gradient(145deg,var(--accent),var(--ink));
      overflow:hidden;
    }
    .card-icon { width:80px; height:80px; object-fit:contain; display:block; }
    .card-content { min-width:0; flex:1; }
    .card h2 { color:var(--ink); margin:0 0 8px; font-size:clamp(23px,2.1vw,36px); font-family:solaiman-lipi; line-height:1.25; font-weight:800; overflow-wrap:anywhere; }
    .url {
      display:block; padding:10px 13px; border-radius:30px;
      background:rgba(255,255,255,.74); border:1px solid rgba(255,255,255,.9);
      color:#164f7c; font-family:Arial,sans-serif; font-size:clamp(12px,1.18vw,18px);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; visibility:hidden;
    }
    .card-bottom { font-family:solaiman-lipi; display:flex; justify-content:flex-end; position:relative; z-index:1; margin-top:18px; }
    .visit {
      border-radius:30px; background:linear-gradient(100deg,var(--accent),var(--ink));
      color:#fff; padding:11px 24px; font-size:20px; font-weight:700;
      display:inline-flex; align-items:center; gap:12px; box-shadow:0 3px 7px rgba(0,0,0,.06);
    }
    .visit .arrow { font-family:Arial,sans-serif; font-size:25px; line-height:1; }
    .coral { --accent:#ff5365; --pale:#fff0f2; --edge:#ffc6ce; --ink:#b30d39; }
    .blue { --accent:#087ee1; --pale:#e6f4ff; --edge:#a8dfff; --ink:#0750a5; }
    .green { --accent:#05a94f; --pale:#e8ffed; --edge:#b8f1c6; --ink:#08743d; }
    .purple { --accent:#6c3ce8; --pale:#f0eaff; --edge:#d2c2ff; --ink:#4a22b9; }
    .orange { --accent:#f47a00; --pale:#fff4df; --edge:#ffdc8c; --ink:#b94700; }
    .teal { --accent:#08a0b4; --pale:#e2fbfc; --edge:#a0e9ee; --ink:#00778d; }
    .royal { --accent:#3267ee; --pale:#eaf0ff; --edge:#b8d0ff; --ink:#1745b5; }
    .pink { --accent:#e62e85; --pale:#fff0f7; --edge:#ffc5e0; --ink:#bd1262; }
    .violet { --accent:#6738d7; --pale:#f0ebff; --edge:#d0c0ff; --ink:#4b22b4; }

    .drawer-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:none; }
    .drawer {
      position:fixed; z-index:21; top:0; left:0; width:min(300px,82vw); height:100vh;
      background:#fff; box-shadow:5px 0 24px rgba(0,0,0,.2); padding:18px 14px;
      transform:translateX(-110%); transition:transform .25s ease;
    }
    .drawer.open { transform:translateX(0); }
    .drawer-backdrop.open { display:block; }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; padding:8px 8px 18px; color:#08743d; font-size:22px; font-weight:bold; }
    .drawer-close { border:0; background:#edf7ef; border-radius:8px; font-size:25px; width:38px; height:38px; }
    .nav-btn {
      width:100%; display:flex; align-items:center; gap:14px; text-align:left;
      border:0; background:transparent; padding:15px 13px; margin:5px 0;
      border-radius:10px; color:#263238; font-family:solaiman-lipi; font-size:21px;
    }
    .nav-btn .nav-emoji { font-size:24px; width:30px; text-align:center; }
    .nav-btn.active { background:#07833a; color:#fff; }
    .page { display:none; }
    .page.active { display:block; }
    .section-title {
      margin:0 28px 18px; padding:14px 18px; border-radius:14px;
      color:#fff; background:linear-gradient(100deg,#08743d,#05a94f);
      font-family:solaiman-lipi; font-size:26px; font-weight:bold;
    }
    .form-panel {
      margin:0 28px; padding:24px; border-radius:18px; background:rgba(255,255,255,.92);
      box-shadow:0 5px 18px rgba(0,0,0,.08);
    }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .field label { display:block; margin-bottom:7px; font-family:solaiman-lipi; font-size:19px; color:#17466b; }
    .field input,.field select {
      width:100%; min-height:48px; border:1px solid #b9cbd7; border-radius:10px;
      padding:10px 12px; background:#fff; color:#18384d; outline:none;
    }
    .field input:focus,.field select:focus { border-color:#07833a; box-shadow:0 0 0 3px rgba(8,131,58,.12); }
    .form-actions { display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }
    .primary-btn,.secondary-btn {
      border:0; border-radius:10px; padding:12px 22px; font-family:solaiman-lipi;
      font-size:19px; font-weight:bold;
    }
    .primary-btn { background:#07833a; color:#fff; }
    .secondary-btn { background:#e8eef2; color:#29465a; }
    .table-wrap { margin:0 28px; overflow-x:auto; background:#fff; border-radius:14px; box-shadow:0 5px 18px rgba(0,0,0,.08); }
    .table-tools { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; background:#087a35; color:#fff; font-family:solaiman-lipi; font-size:23px; }
    .table-tools input { max-width:330px; width:100%; border:0; border-radius:9px; padding:10px 12px; color:#243746; }
    table { width:100%; border-collapse:collapse; min-width:760px; }
    th,td { border:1px solid #d6e0e5; padding:11px 10px; text-align:center; font-family:solaiman-lipi; font-size:17px; }
    th { background:#dff5e4; color:#174b2b; white-space:nowrap; }
    td.title-cell { text-align:left; font-weight:bold; }
    .color-chip { display:inline-block; width:27px; height:27px; border-radius:8px; border:1px solid #999; vertical-align:middle; }
    .action-cell { white-space:nowrap; }
    .icon-action {
      width:39px; height:36px; border:0; border-radius:8px; margin:2px;
      color:#fff; font-size:21px; line-height:1; box-shadow:0 2px 4px rgba(0,0,0,.15);
    }
    .view-action { background:#07833a; }
    .edit-action { background:#087ee1; }
    .delete-action { background:#df2935; }
    .empty-state { padding:25px; text-align:center; color:#607d8b; font-family:solaiman-lipi; font-size:19px; }
    .modal-backdrop { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.48); display:none; align-items:center; justify-content:center; padding:16px; }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(520px,100%); background:#fff; border-radius:16px; padding:22px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
    .modal h3 { margin:0 0 14px; color:#08743d; font-family:solaiman-lipi; font-size:25px; }
    .modal p { overflow-wrap:anywhere; line-height:1.6; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
    .notice { margin:24px 28px 0; padding:14px 18px; border:1px solid #83d69a; border-radius:14px; background:#e8ffed; color:#145b2b; font-family:solaiman-lipi; font-size:18px; }
    @media (max-width:1050px) {
      body { padding:16px; }
      .cards { grid-template-columns:repeat(2,minmax(0,1fr)); padding:0 18px; gap:18px; }
      .card { min-height:205px; padding:18px; }
      .icon-wrap { flex-basis:78px; width:78px; height:78px; }
      .card-icon { width:60px; height:60px; }
      .spark { display:none; }
    }
    @media (max-width:620px) {
      body { padding:5px; }
      .board { border-radius:20px; padding-bottom:16px; }
      .hero { min-height:100px; border-radius:19px; margin-bottom:16px; padding:20px 48px; }
      .hero h1 { font-size:20px; }
      .hero p { color: white; font-size:13px; line-height:1.6; }
      .hero .chain { margin-right:7px; }
      .menu-toggle { left:8px; width:40px; height:42px; font-size:27px; }
      .cards {
    grid-template-columns:repeat(2,minmax(0,1fr));
    padding:0 0px;
    gap:10px;
}

.card {
    height:150px;
    padding: 5px;
}

.card-top {
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:10px;
}

.icon-wrap {
    flex:0 0 64px;
    width:64px;
    height:64px;
}

.card-icon {
    width:50px;
    height:50px;
}

.card-content {
    width:100%;
    text-align:center;
}

.card h2 {
    font-size:15px;
    line-height:15px;
    overflow-wrap:normal;
    word-break:normal;
}

.card-bottom {
    justify-content:center;
    margin-top:2px;
}

.visit {
    width:100%;
    justify-content:center;
    font-size:15px;
    padding:9px 6px;
}
      
      .visit .arrow { font-size:21px; }
      .section-title { margin:0 0px 14px; font-size:22px; }
      .form-panel,.table-wrap { margin:0px; }
      .form-panel { padding:17px; }
      .form-grid { grid-template-columns:1fr; gap:13px; }
      .table-tools { align-items:stretch; flex-direction:column; font-size:20px; }
      .table-tools input { max-width:none; }
      .notice { margin:18px 12px 0; font-size:16px; }

      table {
    table-layout: ixed;
}

th:nth-child(3),
td:nth-child(3) {
    width: 160px;
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
    }
  </style>
</head>
<body>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <nav class="drawer" id="drawer" aria-label="প্রধান মেনু">
    <div class="drawer-head"><span>প্রধান মেনু</span><button class="drawer-close" id="drawerClose" aria-label="বন্ধ করুন">×</button></div>
    <button class="nav-btn active" data-page="dashboard"><span class="nav-emoji">🏠</span>ড্যাশবোর্ড</button>
    <button class="nav-btn" data-page="add"><span class="nav-emoji">➕</span>নতুন কার্ড যুক্ত</button>
    <button class="nav-btn" data-page="all"><span class="nav-emoji">📋</span>সকল কার্ড</button>
  </nav>

  <main class="board">
    <header class="hero">
      <button class="menu-toggle" id="menuToggle" aria-label="মেনু খুলুন">☰</button>
      <h1><span class="chain">🔗</span>গুরুত্বপূর্ণ লিংক সমূহ</h1>
      <p>প্রয়োজনীয় সাইটে ভিজিট করতে লিংকে ক্লিক করুন</p>
      <span class="spark" aria-hidden="true">♡</span>
    </header>

    <section class="page active" id="page-dashboard">
      <section class="cards" id="linkCards" aria-label="গুরুত্বপূর্ণ লিংক"></section>
      <div class="notice">ℹ️&nbsp; নতুন কার্ড যুক্ত বা পরিবর্তন করতে ৩ লাইনের মেনু ব্যবহার করুন।</div>
    </section>

    <section class="page" id="page-add">
      <h2 class="section-title" id="formHeading">➕ নতুন কার্ড যুক্ত করুন</h2>
      <form class="form-panel" id="cardForm">
        <div class="form-grid">
          <div class="field"><label for="cardTitle">কার্ডের নাম</label><input id="cardTitle" required maxlength="100" placeholder="যেমন: আমার ওয়েবসাইট"></div>
          <div class="field"><label for="cardUrl">লিংক / URL</label><input id="cardUrl" required type="text" placeholder="https://example.com"></div>
          <div class="field"><label for="cardIcon">আইকন ছবির URL (ঐচ্ছিক)</label><input id="cardIcon" type="url" placeholder="https://example.com/icon.png"></div>
          <div class="field"><label for="cardTheme">কার্ডের রং</label>
            <select id="cardTheme">
              <option value="coral">লাল / Coral</option><option value="blue">নীল / Blue</option>
              <option value="green">সবুজ / Green</option><option value="purple">বেগুনি / Purple</option>
              <option value="orange">কমলা / Orange</option><option value="teal">আকাশি / Teal</option>
              <option value="royal">রয়েল ব্লু</option><option value="pink">গোলাপি / Pink</option>
              <option value="violet">ভায়োলেট</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button class="primary-btn" type="submit" id="saveCardBtn">💾 সংরক্ষণ</button>
          <button class="secondary-btn" type="button" id="cancelFormBtn">বাতিল</button>
        </div>
      </form>
    </section>

    <section class="page" id="page-all">
      <h2 class="section-title">📋 সকল কার্ড</h2>
      <div class="table-wrap">
        <div class="table-tools"><span>সকল কার্ড (মোট: <strong id="cardCount">0</strong> টি)</span><input id="tableSearch" type="search" placeholder="নাম বা লিংক দিয়ে খুঁজুন..."></div>
        <table>
          <thead><tr><th>নং</th><th>কার্ডের নাম</th><th>লিংক</th><th>আইকন</th><th>রং</th><th>অ্যাকশন</th></tr></thead>
          <tbody id="cardsTableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyTable" hidden>কোনো কার্ড পাওয়া যায়নি।</div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="viewModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">কার্ডের বিবরণ</h3>
      <div id="modalContent"></div>
      <div class="modal-actions"><button class="primary-btn" id="openLinkBtn" type="button">🔗 লিংক খুলুন</button><button class="secondary-btn" id="closeModalBtn" type="button">বন্ধ</button></div>
    </div>
  </div>

  <script>
    const defaultLinks = [
      { title:"বদলী রেশনীর তথ্য সংরক্ষণ", url:"https://masumbillah6778.github.io/rab/online-data-storage-v9/", theme:"coral", icon:"home" },
      { title:"র‌্যাব - ৮ ফোনবুক", url:"https://masumbillah6778.github.io/srb-8-phonebook/index.html", theme:"blue", icon:"dashboard" },
      { title:"বকেয়া রেশন ক্যালকুলেটর", url:"https://rab-8.github.io/srb/ration-bokeya-calculator.html", theme:"green", icon:"search" },
      { title:"বয়স ক্যালকুলেটরে", url:"https://rab-8.github.io/html/age-calculator-v2.html", theme:"purple", icon:"settings" },
      { title:"আপডেট চলছে", url:"#", theme:"orange", icon:"users" },
      { title:"আপডেট চলছে", url:"#", theme:"teal", icon:"download" },
      { title:"আপডেট চলছে", url:"#", theme:"royal", icon:"globe" },
      { title:"SRB", url:"https://rab-8.github.io/srb/index.html", theme:"pink", icon:"mail" },
      { title:"যোগাযোগ করুন", url:"tel:+8801754604359", theme:"violet", icon:"phone" }
    ];
    const icons = {
      home:"https://rab-8.github.io/images/SRB-8.png",
      dashboard:"https://rab-8.github.io/images/SRB-8.png",
      search:"https://rab-8.github.io/images/calculator.png",
      settings:"https://rab-8.github.io/images/calculator.png",
      users:"https://example.com/users.png",
      download:"https://example.com/download.png",
      globe:"https://example.com/globe.png",
      mail:"https://rab-8.github.io/images/SRB-8.png",
      phone:"https://rab-8.github.io/images/call.png"
    };
    const STORAGE_KEY = "importantLinksCards_v1";
    let links = loadLinks();
    let editingIndex = -1;
    let selectedViewLink = "#";

    function loadLinks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (error) { console.warn("Saved cards could not be loaded:", error); }
      return defaultLinks.map(item => ({...item}));
    }
    function saveLinks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
        return true;
      } catch (error) {
        alert("কার্ড সংরক্ষণ করা যায়নি। ব্রাউজারের Local Storage পরীক্ষা করুন।");
        return false;
      }
    }
    function getIconUrl(item) { return item.iconUrl || icons[item.icon] || ""; }
    function safeLink(url) {
      const value = String(url || "").trim();
      if (value === "#") return "#";
      if (/^(https?:\/\/|tel:|mailto:)/i.test(value)) return value;
      return "https://" + value;
    }
    function renderCards() {
      const container = document.getElementById("linkCards");
      container.replaceChildren();
      links.forEach((item) => {
        const card = document.createElement("a");
        card.className = `card ${item.theme || "blue"}`;
        const href = safeLink(item.url);
        card.href = href;
        card.target = /^https?:\/\//i.test(href) ? "_blank" : "_self";
        if (card.target === "_blank") card.rel = "noopener noreferrer";
        card.setAttribute("aria-label", `${item.title} খুলুন`);

        const top = document.createElement("div"); top.className = "card-top";
        const iconWrap = document.createElement("div"); iconWrap.className = "icon-wrap"; iconWrap.setAttribute("aria-hidden","true");
        if (getIconUrl(item)) {
          const img = document.createElement("img"); img.className = "card-icon"; img.alt = ""; img.loading = "lazy"; img.src = getIconUrl(item);
          img.onerror = () => { img.replaceWith(document.createTextNode("🔗")); };
          iconWrap.appendChild(img);
        } else { iconWrap.textContent = "🔗"; }
        const content = document.createElement("div"); content.className = "card-content";
        const title = document.createElement("h2"); title.textContent = item.title;
        const url = document.createElement("span"); url.className = "url"; url.textContent = String(item.url || "").replace(/^https?:\/\//, "");
        content.append(title,url); top.append(iconWrap,content);
        const bottom = document.createElement("div"); bottom.className = "card-bottom";
        const visit = document.createElement("span"); visit.className = "visit"; visit.append("সাইটে যান ");
        const arrow = document.createElement("span"); arrow.className = "arrow"; arrow.textContent = "→"; visit.appendChild(arrow);
        bottom.appendChild(visit); card.append(top,bottom); container.appendChild(card);
      });
      renderTable();
    }
    function renderTable() {
      const body = document.getElementById("cardsTableBody");
      const query = document.getElementById("tableSearch").value.trim().toLowerCase();
      body.replaceChildren();
      const filtered = links.map((item,index)=>({item,index})).filter(({item}) =>
        `${item.title} ${item.url}`.toLowerCase().includes(query)
      );
      document.getElementById("cardCount").textContent = links.length;
      document.getElementById("emptyTable").hidden = filtered.length !== 0;
      filtered.forEach(({item,index},rowNo) => {
        const tr = document.createElement("tr");
        const values = [rowNo+1,item.title,item.url];
        values.forEach((value,i) => {
          const td = document.createElement("td");
          if (i===1) td.className = "title-cell";
          td.textContent = value;
          tr.appendChild(td);
        });
        const iconTd = document.createElement("td");
        if (getIconUrl(item)) {
          const img = document.createElement("img"); img.src = getIconUrl(item); img.alt=""; img.width=32; img.height=32; img.style.objectFit="contain";
          img.onerror=()=>{img.replaceWith(document.createTextNode("🔗"));}; iconTd.appendChild(img);
        } else iconTd.textContent="🔗";
        tr.appendChild(iconTd);
        const colorTd = document.createElement("td"); const chip = document.createElement("span"); chip.className=`color-chip ${item.theme || "blue"}`; chip.style.backgroundColor=`var(--${item.theme || "blue"}-chip, transparent)`; chip.title=item.theme || "blue";
        const colorMap={coral:"#ff5365",blue:"#087ee1",green:"#05a94f",purple:"#6c3ce8",orange:"#f47a00",teal:"#08a0b4",royal:"#3267ee",pink:"#e62e85",violet:"#6738d7"};
        chip.style.backgroundColor=colorMap[item.theme] || colorMap.blue; colorTd.appendChild(chip); tr.appendChild(colorTd);
        const actionTd = document.createElement("td"); actionTd.className="action-cell";
        const view=document.createElement("button"); view.type="button"; view.className="icon-action view-action"; view.textContent="👁️"; view.title="ভিউ"; view.setAttribute("aria-label","ভিউ"); view.addEventListener("click",()=>viewCard(index));
        const edit=document.createElement("button"); edit.type="button"; edit.className="icon-action edit-action"; edit.textContent="✏️"; edit.title="এডিট"; edit.setAttribute("aria-label","এডিট"); edit.addEventListener("click",()=>editCard(index));
        const del=document.createElement("button"); del.type="button"; del.className="icon-action delete-action"; del.textContent="🗑️"; del.title="ডিলেট"; del.setAttribute("aria-label","ডিলেট"); del.addEventListener("click",()=>deleteCard(index));
        actionTd.append(view,edit,del); tr.appendChild(actionTd); body.appendChild(tr);
      });
    }
    function openDrawer(open) {
      document.getElementById("drawer").classList.toggle("open",open);
      document.getElementById("drawerBackdrop").classList.toggle("open",open);
    }
    function showPage(page) {
      document.querySelectorAll(".page").forEach(el=>el.classList.toggle("active",el.id===`page-${page}`));
      document.querySelectorAll(".nav-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.page===page));
      openDrawer(false);
      if(page==="all") renderTable();
      if(page==="add" && editingIndex===-1) resetForm();
    }
    function resetForm() {
      document.getElementById("cardForm").reset();
      document.getElementById("formHeading").textContent="➕ নতুন কার্ড যুক্ত করুন";
      document.getElementById("saveCardBtn").textContent="💾 সংরক্ষণ";
      editingIndex=-1;
    }
    function editCard(index) {
      const item=links[index]; if(!item) return;
      editingIndex=index;
      document.getElementById("cardTitle").value=item.title || "";
      document.getElementById("cardUrl").value=item.url || "";
      document.getElementById("cardIcon").value=item.iconUrl || "";
      document.getElementById("cardTheme").value=item.theme || "blue";
      document.getElementById("formHeading").textContent="✏️ কার্ড এডিট করুন";
      document.getElementById("saveCardBtn").textContent="💾 পরিবর্তন সংরক্ষণ";
      showPage("add");
    }
    function deleteCard(index) {
      const item=links[index]; if(!item) return;
      if(!confirm(`“${item.title}” কার্ডটি ডিলেট করতে চান?`)) return;
      links.splice(index,1);
      if(saveLinks()) renderCards();
    }
    function viewCard(index) {
      const item=links[index]; if(!item) return;
      selectedViewLink=safeLink(item.url);
      document.getElementById("modalTitle").textContent=item.title;
      const content=document.getElementById("modalContent"); content.replaceChildren();
      const p1=document.createElement("p"); p1.textContent="লিংক: "+item.url;
      const p2=document.createElement("p"); p2.textContent="কার্ডের রং: "+(item.theme || "blue");
      content.append(p1,p2);
      document.getElementById("viewModal").classList.add("open");
    }

    document.getElementById("menuToggle").addEventListener("click",()=>openDrawer(true));
    document.getElementById("drawerClose").addEventListener("click",()=>openDrawer(false));
    document.getElementById("drawerBackdrop").addEventListener("click",()=>openDrawer(false));
    document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>showPage(btn.dataset.page)));
    document.getElementById("tableSearch").addEventListener("input",renderTable);
    document.getElementById("cancelFormBtn").addEventListener("click",()=>{resetForm();showPage("all");});
    document.getElementById("cardForm").addEventListener("submit",event=>{
      event.preventDefault();
      const title=document.getElementById("cardTitle").value.trim();
      let url=document.getElementById("cardUrl").value.trim();
      const iconUrl=document.getElementById("cardIcon").value.trim();
      const theme=document.getElementById("cardTheme").value;
      if(!title || !url) { alert("কার্ডের নাম ও লিংক লিখুন।"); return; }
      if(!/^(https?:\/\/|tel:|mailto:|#)/i.test(url)) url="https://"+url;
      const record={title,url,theme,iconUrl,icon:""};
      const wasEditing = editingIndex >= 0;
      if(wasEditing) links[editingIndex]=record; else links.push(record);
      if(saveLinks()) {
        resetForm(); renderCards(); showPage("all");
        alert(wasEditing ? "কার্ড আপডেট হয়েছে।" : "নতুন কার্ড সংরক্ষণ হয়েছে।");
      }
    });
    document.getElementById("closeModalBtn").addEventListener("click",()=>document.getElementById("viewModal").classList.remove("open"));
    document.getElementById("viewModal").addEventListener("click",event=>{if(event.target.id==="viewModal") event.currentTarget.classList.remove("open");});
    document.getElementById("openLinkBtn").addEventListener("click",()=>{
      if(selectedViewLink && selectedViewLink!=="#") window.open(selectedViewLink,"_blank","noopener");
    });

    renderCards();
  </script>
</body>
</html>
